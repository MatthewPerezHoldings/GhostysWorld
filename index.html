<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Ghosty's World</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden; }
      #game { display: flex; align-items: center; justify-content: center; height: 100vh; touch-action: none; }

      /* Portrait rotate prompt — shown only on touch + portrait. */
      #rotate-prompt {
        position: fixed;
        inset: 0;
        background: #111;
        color: #eee;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        text-align: center;
        padding: 1rem;
        z-index: 1000;
      }
      #rotate-prompt .icon {
        font-size: 4rem;
        animation: rotate-hint 2s ease-in-out infinite;
        margin-bottom: 1rem;
      }
      #rotate-prompt h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      #rotate-prompt p  { font-size: 1rem; margin: 0; color: #aaa; }
      @keyframes rotate-hint {
        0%, 100% { transform: rotate(0deg); }
        50%      { transform: rotate(-90deg); }
      }
      /* Touch device + portrait → show overlay. */
      @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
        #rotate-prompt { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-prompt" aria-hidden="true">
      <div class="icon">📱</div>
      <h1>Rotate your phone</h1>
      <p>Ghosty's World plays in landscape.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
